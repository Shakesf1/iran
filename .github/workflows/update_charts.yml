name: Deploy Dashboard

on:
  schedule:
    - cron: '*/15 * * * *' # Runs at minute 0, 15, 30, and 45
  push:
    branches: ["main"]
  workflow_dispatch:     # Manual run button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Upgraded from 3.10 to fix curl_cffi import issue

      - name: Install Dependencies
        run: pip install pandas curl_cffi matplotlib numpy 

      - name: Generate Data
        run: python iran.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Automated data sync: $(date -u)" || echo "No changes to commit"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything in the root (index.html, daily_data.json, etc.)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
