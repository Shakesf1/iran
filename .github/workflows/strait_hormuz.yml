name: Strait of Hormuz Monitor

on:
  schedule:
    # Runs at :05 and :35 of every hour
    - cron: '5,35 * * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  track_vessels:
    runs-on: ubuntu-latest
    # Permissions needed to commit the DB back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Important for rebasing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Removed libgconf-2-4, added modern dependencies for Ubuntu 24.04
          sudo apt-get install -y \
            xvfb \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 \
            libasound2t64 \
            google-chrome-stable

      - name: Install Python Packages
        run: |
          pip install DrissionPage geopandas shapely supabase python-dotenv

      - name: Random Delay (Jitter)
        run: |
          DELAY=$((1 + RANDOM % 160))
          echo "Waiting for $DELAY seconds..."
          sleep $DELAY


      - name: Run Shipping Monitor
        env:
          DISPLAY: :99
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}          
        run: |
          #          1. Force kill any existing chrome or xvfb processes
          pkill -9 chrome || true
          pkill -9 chromium || true
          pkill -9 Xvfb || true
          
          # 2. Clear out temp user profiles to prevent "Profile in Use" errors
          rm -rf /tmp/.com.google.Chrome.* || true
          rm -rf /tmp/.org.chromium.Chromium.* || true
          
          # 3. Start the virtual display
          Xvfb :99 -screen 0 1920x1080x24 &
          
          # 4. Wait a moment for Xvfb to initialize
          sleep 10

          python -u shipping.py

      - name: Generate Shipping Maps
        run: |
          python -u shipmapping.py


      - name: Commit and Push Data
        env:
          DISPLAY: :99
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}    
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. Check exactly where the file is
          echo "Locating dashboard_stats.json..."
          find . -name "dashboard_stats.json"

          # 3. Pull latest changes to avoid conflicts (non-rebase)
          git pull origin main --no-rebase

          # 4. Add the file (using wildcard to ensure it's found if in a subdir)
          git add **/dashboard_stats.json || git add dashboard_stats.json

          # 5. Only commit and push if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes detected in dashboard_stats.json"
          else
            git commit -m "Update shipping data and dashboard [skip ci]"
            git push origin main
          fi


